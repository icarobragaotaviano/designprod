name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar estrutura e testar guias e sangria
        run: npm test

      - name: Conferir se o catálogo está sincronizado
        run: |
          npm run catalog
          git diff --exit-code catalog.json plugins/photoshop-uxp/src/catalog.json

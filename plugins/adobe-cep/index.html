<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IBD Ferramentas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="cabecalho">
      <div class="cabecalho-linha">
        <div class="titulo-grupo">
          <span class="badge-marca" id="marca">IBD</span>
          <div class="titulo-texto">
            <h1 id="titulo-painel">Ferramentas</h1>
            <span class="contexto"><span id="nome-host">Illustrator</span> · <span id="versao">v0.1.0</span></span>
          </div>
        </div>
        <div class="modo-grupo">
          <button type="button" id="modo-grade" class="modo-btn" title="Grade de iconezinhos" aria-pressed="true">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/></svg>
          </button>
          <button type="button" id="modo-lista" class="modo-btn" title="Lista detalhada" aria-pressed="false">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 5h10M7 10h10M7 15h10M3 5h1M3 10h1M3 15h1"/></svg>
          </button>
          <button type="button" id="btn-gerenciar" class="modo-btn modo-btn-gerenciar" title="Mostrar ou ocultar funcoes" aria-pressed="false">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 10s3.2-5 8-5 8 5 8 5-3.2 5-8 5-8-5-8-5z"/><circle cx="10" cy="10" r="2.2"/></svg>
            <span class="ocultas-badge" id="ocultas-badge" hidden>0</span>
          </button>
        </div>
      </div>
    </header>

    <div class="barra-busca">
      <input id="filtro" type="text" placeholder="Buscar por nome ou tag..." aria-label="Buscar ferramentas" />
      <select id="sel-app" aria-label="Software ativo">
        <option value="illustrator">Illustrator</option>
        <option value="aftereffects">After Effects</option>
        <option value="indesign">InDesign</option>
        <option value="photoshop">Photoshop</option>
      </select>
    </div>

    <nav class="abas" id="abas" role="tablist" aria-label="Categorias">
      <button type="button" class="aba" data-aba="todos" role="tab" aria-selected="true">Todos</button>
      <button type="button" class="aba" data-aba="favoritos" role="tab" aria-selected="false">★ Favoritos <span class="aba-badge" id="fav-contador">0</span></button>
    </nav>

    <main id="lista" class="lista"></main>

    <details id="folha-painel" class="folha-painel" hidden>
      <summary>Folha · Montagem de peças</summary>
      <form id="folha-form">
        <fieldset>
          <legend>Folha de máquina e peça</legend>
          <label class="folha-largo">Formato da folha <select id="folha-formato"><option value="">Personalizado</option></select></label>
          <label>Largura da folha (mm) <input name="sw" type="number" min="0.1" step="any" value="328" required></label>
          <label>Altura da folha (mm) <input name="sh" type="number" min="0.1" step="any" value="478" required></label>
          <label>Largura da peça (mm) <input name="pw" type="number" min="0.1" step="any" value="90" required></label>
          <label>Altura da peça (mm) <input name="ph" type="number" min="0.1" step="any" value="50" required></label>
          <label>Sangria (mm) <input name="bleed" type="number" min="0" step="any" value="3" required></label>
          <label>Tiragem <input name="qty" type="number" min="1" step="1" value="1000" required></label>
          <label>Refile <select name="corte"><option value="duplo">Duplo · Sangrias independentes</option><option value="simples">Simples · Corte compartilhado</option></select></label>
          <label>Orientação <select name="orientation"><option value="auto">Melhor grade uniforme</option><option value="normal">0°</option><option value="rotate">90°</option><option value="mixed">Corte misto</option></select></label>
          <label>Folga extra entre sangrias (mm) <input name="folga" type="number" min="0" step="any" value="0" required></label>
          <label>Fibra da folha <select name="grain"><option value="none">Não informada</option><option value="x">Paralela à largura</option><option value="y">Paralela à altura</option></select></label>
          <label>Eixo do vinco <select name="pieceGrain"><option value="free">Sem restrição</option><option value="width">Paralelo à largura da peça</option><option value="height">Paralelo à altura da peça</option></select></label>
        </fieldset>
        <fieldset>
          <legend>Margens da máquina</legend>
          <label>Margem técnica (mm) <input name="margem" type="number" min="0" step="any" value="5" required></label>
          <label>Reserva de pinça (mm) <input name="pinca" type="number" min="0" step="any" value="12" required></label>
          <label>Lado da pinça <select name="pincaLado"><option value="bottom">Inferior</option><option value="top">Superior</option><option value="left">Esquerdo</option><option value="right">Direito</option></select></label>
        </fieldset>
        <button type="submit">Calcular</button>
      </form>
      <label for="folha-arquivo">Ou importe um plano de montagem (JSON)</label>
      <input id="folha-arquivo" type="file" accept=".json,application/json">
      <fieldset class="folha-saida">
        <legend>Saída no Illustrator</legend>
        <label class="folha-largo">Montagem <select id="folha-saida">
          <option value="producao">Novo CMYK · Modelo com marcas técnicas</option>
          <option value="vinculada">Novo CMYK · Repetir arte vinculada</option>
          <option value="prova">Documento aberto · Prova geométrica</option>
          <option value="selecao">Documento aberto · Repetir objeto selecionado</option>
        </select></label>
        <label class="folha-largo" id="folha-sangrada-opcao" hidden><input id="folha-sangrada" type="checkbox" checked> Arte inclui sangria simétrica (PDF, AI ou EPS)</label>
        <div id="folha-marcas" class="folha-opcoes folha-largo">
          <label>Afastamento (mm) <input id="folha-offset" type="number" min="0" step="any" value="3.5" required></label>
          <label>Comprimento (mm) <input id="folha-comprimento" type="number" min="0.1" step="any" value="5" required></label>
          <label>Traço (pt) <input id="folha-stroke" type="number" min="0.25" max="0.5" step="any" value="0.35" required></label>
          <label>Identificação da OS <input id="folha-os" type="text" maxlength="80"></label>
          <label><input id="folha-registro" type="checkbox" checked> Miras de registro</label>
          <label><input id="folha-barra" type="checkbox"> Barra de controle CMYK</label>
          <label class="folha-patch" hidden>Largura do patch (mm) <input id="folha-patch-w" type="number" min="0.1" step="any" value="5" required></label>
          <label class="folha-patch" hidden>Altura do patch (mm) <input id="folha-patch-h" type="number" min="0.1" step="any" value="5" required></label>
        </div>
      </fieldset>
      <p id="folha-previa" role="status"></p>
      <svg id="folha-diagrama" role="img" aria-label="Prévia geométrica da primeira face" hidden></svg>
      <button id="folha-aplicar" type="button" disabled>Criar montagem no Illustrator</button>
      <p id="folha-status" role="status"></p>
    </details>

    <footer class="rodape">
      <span id="status" role="status" aria-live="polite">Pronto. Clique em um icone para rodar.</span>
    </footer>

    <script src="js/CSInterface.js"></script>
    <script src="js/icones.js"></script>
    <script src="catalog.js"></script>
    <script src="bundle/folha/engine.js"></script>
    <script src="bundle/folha/operacoes.js"></script>
    <script src="js/folha-producao.js"></script>
    <script src="js/folha.js"></script>
    <script src="main.js"></script>
  </body>
</html>

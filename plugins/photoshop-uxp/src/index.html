<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>IBD Ferramentas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="cabecalho">
      <span class="marca" id="marca">IBD</span>
      <span class="versao" id="versao"></span>

      <input id="filtro" type="text" placeholder="Filtrar ferramentas" />

    <main id="lista" class="lista"></main>

    <footer class="rodape">
      <span id="status">Pronto.</span>
    </footer>

    <script src="main.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IBD Ferramentas</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="bundle/folha/painel-uxp.css" />
  </head>
  <body>
    <header class="cabecalho">
      <div class="cabecalho-linha">
        <div class="titulo-grupo">
          <span class="badge-marca" id="marca">IBD</span>
          <div class="titulo-texto">
            <h1 id="titulo-painel">Ferramentas</h1>
            <span class="contexto">Photoshop · <span id="versao">v0.1.0</span></span>
          </div>
        </div>
        <div class="modo-grupo" role="group" aria-label="Modo de exibicao">
          <button type="button" id="modo-grade" class="modo-btn" title="Grade de iconezinhos" aria-pressed="true">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/></svg>
          </button>
          <button type="button" id="modo-lista" class="modo-btn" title="Lista detalhada" aria-pressed="false">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 5h10M7 10h10M7 15h10M3 5h1M3 10h1M3 15h1"/></svg>
          </button>
          <button type="button" id="btn-gerenciar" class="modo-btn modo-btn-gerenciar" title="Mostrar ou ocultar funcoes" aria-pressed="false">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 10s3.2-5 8-5 8 5 8 5-3.2 5-8 5-8-5-8-5z"/><circle cx="10" cy="10" r="2.2"/></svg>
            <span class="ocultas-badge" id="ocultas-badge" hidden>0</span>
          </button>
        </div>
      </div>
    </header>

    <div class="barra-busca folha-uxp-busca">
      <input id="filtro" type="text" placeholder="Buscar por nome ou palavra-chave..." aria-label="Buscar ferramentas" />
      <button type="button" id="abrir-folha">Folha</button>
    </div>

    <nav class="abas" id="abas" role="tablist" aria-label="Categorias">
      <button type="button" class="aba" data-aba="todos" role="tab" aria-selected="true">Todos</button>
      <button type="button" class="aba" data-aba="favoritos" role="tab" aria-selected="false">★ Favoritos <span class="aba-badge" id="fav-contador">0</span></button>
      <button type="button" class="aba" data-aba="scripts" role="tab" aria-selected="false">Scripts</button>
      <button type="button" class="aba" data-aba="actions" role="tab" aria-selected="false">Actions</button>
    </nav>

    <main id="lista" class="lista" aria-labelledby="titulo-painel"></main>
    <main id="folha-painel" class="folha-uxp-painel" aria-label="Folha" style="display:none"></main>

    <footer class="rodape">
      <span id="status" role="status" aria-live="polite" aria-atomic="true">Pronto. Clique em qualquer icone para executar.</span>
    </footer>
    <script src="main.js"></script>
  </body>
</html>
